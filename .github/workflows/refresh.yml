name: Hourly news scan

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  # Bot data commits use GITHUB_TOKEN, which never triggers workflows, so no loop.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scan news and score impact
        run: node scripts/refresh.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_MODEL: ${{ vars.SCAN_MODEL }}

      - name: Commit the new scan
        run: |
          git config user.name "news-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: hourly scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
