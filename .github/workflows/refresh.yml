name: Daily intelligence feed

on:
  # Once a day, about 25 minutes before the Claude routine that scores the news.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  # Code pushes refresh the feed too; data-only commits (the bot and the routine) don't.
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"

permissions:
  contents: write

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect open-source intelligence signals
        run: node scripts/osint.mjs

      # Paid API path, off by default. Set the repository variable SCAN_WITH_API=true to use it.
      - name: Scan news and score impact (API)
        if: ${{ !cancelled() && vars.SCAN_WITH_API == 'true' }}
        run: node scripts/refresh.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_MODEL: ${{ vars.SCAN_MODEL }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}

      # Runs even if the scan failed, so the intelligence feed still publishes.
      - name: Commit the new data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "news-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: intelligence feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
