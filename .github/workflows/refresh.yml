name: Daily refresh

on:
  # Once a day. GitHub sometimes delays or drops scheduled runs, so later times act as
  # backups: each run skips itself if today's refresh is already done.
  schedule:
    - cron: "17 5 * * *"
    - cron: "47 8 * * *"
    - cron: "17 13 * * *"
    - cron: "47 18 * * *"
  workflow_dispatch:
    inputs:
      test_rule_scan:
        description: "Test only: score the last 24 hours with the keyword rules and show the stories in the run summary, without committing anything"
        type: boolean
        default: false
      publish_rule_scan:
        description: "Publish now: refresh the feed and score with the keyword rules, replacing today's scan even if the Claude routine wrote it"
        type: boolean
        default: false
  # Code pushes refresh the feed too; data-only commits (the bot and the routine) don't.
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"

permissions:
  contents: write

concurrency:
  group: news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Test the keyword-rule scan (no commit)
        if: ${{ inputs.test_rule_scan }}
        run: npm ci && node scripts/rule-scan.mjs
        env:
          FORCE_RULE_SCAN: "1"
          DRY_RUN: "1"

      - name: Check whether today's refresh already ran
        if: ${{ !inputs.test_rule_scan }}
        id: due
        run: |
          node -e '
            const today = new Date().toISOString().slice(0, 10);
            const at = (f, k) => { try { return require(f)[k] || ""; } catch { return ""; } };
            const done = at("./public/data/osint.json", "updatedAt").startsWith(today) && at("./public/data/scan.json", "scannedAt").startsWith(today);
            const run = process.env.EVENT !== "schedule" || !done;
            console.log(run ? "Refreshing." : "Already refreshed today; skipping.");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          '
        env:
          EVENT: ${{ github.event_name }}

      - if: steps.due.outputs.run == 'true'
        run: npm ci

      - name: Collect open-source intelligence signals
        if: steps.due.outputs.run == 'true'
        run: node scripts/osint.mjs

      # Free scoring with keyword rules: no AI, no API key. Skips itself if the optional
      # Claude routine already scored the news in the last 20 hours.
      - name: Score the news with keyword rules
        if: ${{ !cancelled() && steps.due.outputs.run == 'true' }}
        run: node scripts/rule-scan.mjs
        env:
          FORCE_RULE_SCAN: ${{ inputs.publish_rule_scan && '1' || '' }}
          SITE_URL: ${{ vars.SITE_URL }}

      # Paid API path, off by default. Set the repository variable SCAN_WITH_API=true to use it.
      - name: Scan news and score impact (API)
        if: ${{ !cancelled() && steps.due.outputs.run == 'true' && vars.SCAN_WITH_API == 'true' }}
        run: node scripts/refresh.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_MODEL: ${{ vars.SCAN_MODEL }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || vars.ANTHROPIC_WORKSPACE_ID }}

      # Runs even if the scan failed, so the intelligence feed still publishes.
      - name: Commit the new data
        if: ${{ !cancelled() && steps.due.outputs.run == 'true' }}
        run: |
          git config user.name "news-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # Data files are regenerated wholesale; if another run pushed meanwhile, keep this run's newer data.
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
